<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="What's inside: Linux 6.18.60 LTS kernel with the stock arm64 config and no modules; static BusyBox 1.38 with sh, init and ~300 commands; a 1.1 MiB initramfs; rootfs/ with inittab, rcS and os-release">
