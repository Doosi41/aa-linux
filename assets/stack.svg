/text><text x="262" y="208" font-size="11.5" fill="#908caa" xml:space="preserve">in one binary</text><rect x="456" y="24" width="202" height="222" rx="14" fill="#120f1c" fill-opacity=".64" stroke="#fff" stroke-opacity=".10"/><g transform="translate(478,48)" fill="none" stroke="url(#ic)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="9" width="32" height="16" rx="2"/><rect x="6" y="13" width="6" height="8" rx="1"/><rect x="15" y="13" width="6" height="8" rx="1"/><rect x="24" y="13" width="6" height="8" rx="1"/><path d="M6,25 V30 M10,25 V30 M14,25 V30 M18,25 V30 M22,25 V30 M26,25 V30 M30,25 V30 "/></g><text x="638" y="60" font-size="11" fill="#6e6a86" text-anchor="end" xml:space="preserve">03</text><text x="478" y="114" font-size="17" fill="#e0def4" font-weight="800" xml:space="preserve">initramfs</text><rect x="478" y="128" width="123" height="17.5" rx="8.75" fill="#9ccfd8" opacity=".16"/><text x="486" y="140.5" font-size="10.5" fill="#9ccfd8" xml:space="preserve">1.1 MiB · cpio.gz</text><text x="478" y="174" font-size="11.5" fill="#908caa" xml:space="preserve">the whole system is</text><text x="478" y="191" font-size="11.5" fill="#908caa" xml:space="preserve">unpacked into RAM</text><text x="478" y="208" font-size="11.5" fill="#908caa" xml:space="preserve">at boot</text><rect x="672" y="24" width="202" height="222" rx="14" fill="#120f1c" fill-opacity=".64" stroke="#fff" stroke-opacity=".10"/><g transform="translate(694,48)" fill="none" stroke="url(#ic)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3,9 H14 L17,13 H33 V30 H3 Z M3,17 H33"/></g><text x="854" y="60" font-size="11" fill="#6e6a86" text-anchor="end" xml:space="preserve">04</text><text x="694" y="114" font-size="17" fill="#e0def4" font-weight="800" xml:space="preserve">rootfs/</text><rect x="694" y="128" width="73" height="17.5" rx="8.75" fill="#f6c177" opacity=".16"/><text x="702" y="140.5" font-size="10.5" fill="#f6c177" xml:space="preserve">our 