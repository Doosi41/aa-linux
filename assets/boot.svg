ace="preserve"><tspan fill="#6e6a86">[    0.073204] </tspan><tspan fill="#908caa">Unpacking initramfs...</tspan></text><text x="48" y="239" font-size="13" class="l" style="animation-delay:1.26s" xml:space="preserve"><tspan fill="#6e6a86">               ⋮</tspan></text><text x="48" y="260" font-size="13" class="l" style="animation-delay:1.38s" xml:space="preserve"><tspan fill="#6e6a86">[    0.235709] </tspan><tspan fill="#908caa">Freeing unused kernel memory: 3264K</tspan></text><text x="48" y="281" font-size="13" class="l" style="animation-delay:1.50s" xml:space="preserve"><tspan fill="#6e6a86">[    0.235865] </tspan><tspan fill="#9ccfd8">Run /init as init process</tspan></text><text x="48" y="323" font-size="13" class="l" style="animation-delay:1.74s" xml:space="preserve"><tspan fill="url(#pastel)" font-weight="800">Welcome to AA Linux 0.1</tspan></text><text x="48" y="365" font-size="13" class="l" style="animation-delay:2.66s" xml:space="preserve"><tspan fill="#eb6f92" font-weight="700">~ # </tspan><tspan fill="#e0def4">uname -sr</tspan></text><text x="48" y="386" font-size="13" class="l" style="animation-delay:2.78s" xml:space="preserve"><tspan fill="#e0def4">Linux 6.18.60</tspan></text><text x="48" y="407" font-size="13" class="l" style="animation-delay:3.58s" xml:space="preserve"><tspan fill="#eb6f92" font-weight="700">~ # </tspan><tspan fill="#e0def4">cat /etc/os-release</tspan></text><text x="48" y="428" font-size="13" class="l" style="animation-delay:3.70s" xml:space="preserve"><tspan fill="#c4a7e7">NAME=</tspan><tspan fill="#f6c177">&quot;AA Linux&quot;</tspan></text><text x="48" y="449" font-size="13" class="l" style="animation-delay:3.82s" xml:space="preserve"><tspan fill="#c4a7e7">ID=</tspan><tspan fill="#f6c177">aa-linux</tspan></text><text x="48" y="470" font-size="13" class="l" style="animation-delay:3.94s" xml:space="preserve"><tspan fill="#c4a7e7">VERSION_ID=</tspan><tspan fill="#f6c177">0.1</tspan></text><text x="48" y="491" font-size="13" class="l