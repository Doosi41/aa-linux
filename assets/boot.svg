<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="First boot of AA Linux in QEMU: kernel log, then the shell runs uname, cat /etc/os-release and ls /">
  <style>
    text { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
    .l { animation: in .01s linear backwards; }
    @keyframes in { from, to { opacity: 0; } }
    .cur { animation: in .01s linear backwards, bl 1.1s steps(1) infinite; }
    @keyframes bl { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l, .cur { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17141f"/><stop offset="1" stop-color="#0f0d15"/>
    </linearGradient>
    <clipPath id="win"><rect x="10" y="10" width="880" height="580" rx="16"/></clipPath>
    
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ccfd8"/><stop offset=".5" stop-color="#c4a7e7"/><stop offset="1" stop-color="#eb6f92"/>
    </linearGradient>
  </defs>
  
  <rect x="10" y="10" width="880" height="580" rx="16" fill="url(#bg)" stroke="#2a2540"/>
  <line x1="10" y1="50" x2="890" y2="50" stroke="#221e30"/>
  <circle cx="38" cy="30" r="6.5" fill="#eb6f92"/><circle cx="60" cy="30" r="6.5" fill="#f6c177"/><circle cx="82" cy="30" r="6.5" fill="#9ccfd8"/>
  <text x="450.0" y="35" text-anchor="middle" font-size="13" fill="#6e6a86">qemu-system-aarch64 -M virt -accel hvf — ttyAMA0</text>
    <text class="l" style="animation-delay:0.42s" x="30" y="82" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.000000] </tspan><tspan fill="#908caa">Linux version 6.18.60 (qwerty@lima-aa-builder) (gcc (Debian 14.2.0-19) 14.2.0, GNU ld</tspan></text>
  <text class="l" style="animation-delay:0.54s" x="30" y="103" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.000000] </tspan><tspan fill="#908caa">Machine model: linux,dummy-virt</tspan></text>
  <text class="l" style="animation-delay:0.66s" x="30" y="124" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.001891] </tspan><tspan fill="#908caa">smp: Brought up 1 node, 1 CPU</tspan></text>
  <text class="l" style="animation-delay:0.78s" x="30" y="145" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.004249] </tspan><tspan fill="#908caa">Memory: 435620K/524288K available (18368K kernel code, 5442K rwdata, 13220K rodata,</tspan></text>
  <text class="l" style="animation-delay:0.9s" x="30" y="166" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.008009] </tspan><tspan fill="#908caa">9000000.pl011: ttyAMA0 at MMIO 0x9000000 (irq = 13, base_baud = 0) is a PL011 rev1</tspan></text>
  <text class="l" style="animation-delay:1.02s" x="30" y="187" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.072327] </tspan><tspan fill="#908caa">clocksource: Switched to clocksource arch_sys_counter</tspan></text>
  <text class="l" style="animation-delay:1.14s" x="30" y="208" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.073204] </tspan><tspan fill="#908caa">Unpacking initramfs...</tspan></text>
  <text class="l" style="animation-delay:1.26s" x="30" y="229" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">               ⋮</tspan></text>
  <text class="l" style="animation-delay:1.38s" x="30" y="250" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.235709] </tspan><tspan fill="#908caa">Freeing unused kernel memory: 3264K</tspan></text>
  <text class="l" style="animation-delay:1.5s" x="30" y="271" font-size="13" xml:space="preserve"><tspan fill="#6e6a86">[    0.235865] </tspan><tspan fill="#9ccfd8">Run /init as init process</tspan></text>
  <text class="l" style="animation-delay:1.74s" x="30" y="313" font-size="13" xml:space="preserve"><tspan fill="url(#hi)" font-weight="700">Welcome to AA Linux 0.1</tspan></text>
  <text class="l" style="animation-delay:2.66s" x="30" y="355" font-size="13" xml:space="preserve"><tspan fill="#eb6f92" font-weight="700">~ # </tspan><tspan fill="#e0def4">uname -sr</tspan></text>
  <text class="l" style="animation-delay:2.78s" x="30" y="376" font-size="13" xml:space="preserve"><tspan fill="#e0def4">Linux 6.18.60</tspan></text>
  <text class="l" style="animation-delay:3.58s" x="30" y="397" font-size="13" xml:space="preserve"><tspan fill="#eb6f92" font-weight="700">~ # </tspan><tspan fill="#e0def4">cat /etc/os-release</tspan></text>
  <text class="l" style="animation-delay:3.7s" x="30" y="418" font-size="13" xml:space="preserve"><tspan fill="#c4a7e7">NAME=</tspan><tspan fill="#f6c177">"AA Linux"</tspan></text>
  <text class="l" style="animation-delay:3.82s" x="30" y="439" font-size="13" xml:space="preserve"><tspan fill="#c4a7e7">ID=</tspan><tspan fill="#f6c177">aa-linux</tspan></text>
  <text class="l" style="animation-delay:3.94s" x="30" y="460" font-size="13" xml:space="preserve"><tspan fill="#c4a7e7">VERSION_ID=</tspan><tspan fill="#f6c177">0.1</tspan></text>
  <text class="l" style="animation-delay:4.06s" x="30" y="481" font-size="13" xml:space="preserve"><tspan fill="#c4a7e7">PRETTY_NAME=</tspan><tspan fill="#f6c177">"AA Linux 0.1"</tspan></text>
  <text class="l" style="animation-delay:4.86s" x="30" y="502" font-size="13" xml:space="preserve"><tspan fill="#eb6f92" font-weight="700">~ # </tspan><tspan fill="#e0def4">ls /</tspan></text>
  <text class="l" style="animation-delay:4.98s" x="30" y="523" font-size="13" xml:space="preserve"><tspan fill="#9ccfd8" font-weight="700">bin</tspan><tspan fill="#e0def4">      </tspan><tspan fill="#9ccfd8" font-weight="700">etc</tspan><tspan fill="#e0def4">      </tspan><tspan fill="#ebbcba">linuxrc</tspan><tspan fill="#e0def4">  </tspan><tspan fill="#9ccfd8" font-weight="700">root</tspan><tspan fill="#e0def4">     </tspan><tspan fill="#9ccfd8" font-weight="700">sys</tspan><tspan fill="#e0def4">      </tspan><tspan fill="#9ccfd8" font-weight="700">usr</tspan></text>
  <text class="l" style="animation-delay:5.1s" x="30" y="544" font-size="13" xml:space="preserve"><tspan fill="#9ccfd8" font-weight="700">dev</tspan><tspan fill="#e0def4">      </tspan><tspan fill="#ebbcba">init</tspan><tspan fill="#e0def4">     </tspan><tspan fill="#9ccfd8" font-weight="700">proc</tspan><tspan fill="#e0def4">     </tspan><tspan fill="#9ccfd8" font-weight="700">sbin</tspan><tspan fill="#e0def4">     </tspan><tspan fill="#9ccfd8" font-weight="700">tmp</tspan></text>
  <text class="l" style="animation-delay:5.9s" x="30" y="565" font-size="13" xml:space="preserve"><tspan fill="#eb6f92" font-weight="700">~ # </tspan></text>
  <rect class="l cur" style="animation-delay:5.9s, 5.9s" x="62.2" y="553" width="8" height="16" fill="#e0def4"/>
</svg>
