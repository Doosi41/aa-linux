11" fill="#908caa" text-anchor="middle" xml:space="preserve">busybox init,</text><text x="379" y="162" font-size="11" fill="#908caa" text-anchor="middle" xml:space="preserve">pid 1</text><rect x="349" y="42" width="60" height="18" rx="9" fill="#f6c177" opacity=".16"/><text x="379" y="55" font-size="10.5" fill="#f6c177" text-anchor="middle" xml:space="preserve">0.236s</text><path class="flow" d="M440,95 H454" stroke="#c4a7e7" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round" opacity=".85"/><path d="M453,90.5 L459,95 L453,99.5 Z" fill="#c4a7e7"/><rect x="466" y="72" width="110" height="46" rx="12" fill="#120f1c" fill-opacity=".64" stroke="#fff" stroke-opacity=".10"/><text x="521" y="101" font-size="15" fill="#e0def4" font-weight="800" text-anchor="middle" xml:space="preserve">inittab</text><rect x="507" y="110" width="28" height="2.5" rx="1.25" fill="#f6c177"/><text x="521" y="146" font-size="11" fill="#908caa" text-anchor="middle" xml:space="preserve">what to</text><text x="521" y="162" font-size="11" fill="#908caa" text-anchor="middle" xml:space="preserve">start</text><path class="flow" d="M582,95 H596" stroke="#c4a7e7" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round" opacity=".85"/><path d="M595,90.5 L601,95 L595,99.5 Z" fill="#c4a7e7"/><rect x="608" y="72" width="110" height="46" rx="12" fill="#120f1c" fill-opacity=".64" stroke="#fff" stroke-opacity=".10"/><text x="663" y="101" font-size="15" fill="#e0def4" font-weight="800" text-anchor="middle" xml:space="preserve">rcS</text><rect x="649" y="110" width="28" height="2.5" rx="1.25" fill="#ebbcba"/><text x="663" y="146" font-size="11" fill="#908caa" text-anchor="middle" xml:space="preserve">mounts /proc</text><text x="663" y="162" font-size="11" fill="#908caa" text-anchor="middle" xml:space="preserve">/sys /dev</text><path class="flow" d="M724,95 H738" stroke="#c4a7e7" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round" opacity=".85"/><path d="M737,90.5 L743,95 L737,99.5 Z" fill="#c4a7e7"/><rect x="750" y="72" width="110" height="46" rx="12" fill="#120f1c" fill-opacity=".64" stroke="#fff" stroke-opacity=".10"/><text x="805" y="101" font-size="15" fill="#e0def4" font-weight="800" text-anchor="middle" xml:space="preserve">sh</text><rect x="791" y="110" width="28" height="2.5" rx="1.25" fill="#c4a7e7"/><text x="805" y="146" font-size="11" fill="#908caa" text-anchor="middle" xml:space="preserve">shell on</text><text x="805" y="162" font-size="11" fill="#908caa" text-anchor="middle" xml:space="preserve">the console</text>
</g>
</svg>
