<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Boot chain: qemu loads the kernel and initramfs; the kernel (0.000 s) unpacks the initramfs; /init is BusyBox init, pid 1 (0.236 s); init reads inittab; rcS mounts /proc, /sys and /dev; a shell starts on the console">
<style>
text { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
.sans { font-family: Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.tw { animation: tw 4.5s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .1; } }
.cur { animation: bl 1.1s steps(1) infinite; }
@keyframes bl { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.flow { animation: flow .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -16; } }
</style>
<defs>
<radialGradient id="sky" cx=".28" cy=".15" r="1.1">
  <stop offset="0" stop-color="#1d1535"/><stop offset=".55" stop-color="#0f0c1a"/><stop offset="1" stop-color="#07060c"/>
</radialGradient>
<radialGradient id="moon" cx=".38" cy=".35" r=".7">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f1ecff"/><stop offset="1" stop-color="#d9cff5"/>
</radialGradient>
<linearGradient id="swirl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c4a7e7" stop-opacity="0"/><stop offset=".4" stop-color="#c4a7e7"/>
  <stop offset=".7" stop-color="#f6c177"/><stop offset="1" stop-color="#ebbcba" stop-opacity="0"/>
</linearGradient>
<filter id="neb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
<g id="wall">
  <rect width="900" height="200" fill="url(#sky)"/>
  <g filter="url(#neb)"><ellipse cx="720" cy="30" rx="270" ry="180" fill="#c4a7e7" opacity="0.42"/><ellipse cx="135" cy="180" rx="270" ry="198" fill="#eb6f92" opacity="0.26"/><ellipse cx="495" cy="120" rx="180" ry="135" fill="#9ccfd8" opacity="0.14"/><ellipse cx="882" cy="196" rx="234" ry="198" fill="#31748f" opacity="0.5"/><ellipse cx="18" cy="10" rx="198" ry="144" fill="#31748f" opacity="0.34"/></g>
  <g filter="url(#soft)"><ellipse cx="630" cy="60" rx="216" ry="50" fill="none" stroke="url(#swirl)" stroke-width="1.4" opacity="0.45" stroke-dasharray="198 126" transform="rotate(-16 630 60)"/><ellipse cx="630" cy="60" rx="336" ry="77" fill="none" stroke="url(#swirl)" stroke-width="1.0" opacity="0.35" stroke-dasharray="308 196" transform="rotate(-12 630 60)"/><ellipse cx="630" cy="60" rx="480" ry="110" fill="none" stroke="url(#swirl)" stroke-width="1.6" opacity="0.25" stroke-dasharray="440 280" transform="rotate(-19 630 60)"/><ellipse cx="630" cy="60" rx="648" ry="148" fill="none" stroke="url(#swirl)" stroke-width="0.9" opacity="0.22" stroke-dasharray="594 378" transform="rotate(-14 630 60)"/><ellipse cx="630" cy="60" rx="816" ry="187" fill="none" stroke="url(#swirl)" stroke-width="1.2" opacity="0.16" stroke-dasharray="748 476" transform="rotate(-17 630 60)"/></g>
  
  <circle class="tw" style="animation-delay:0.19s" cx="11" cy="22" r="1.1" fill="#fff" opacity="0.82"/><circle cx="659" cy="105" r="0.7" fill="#fff" opacity="0.35"/><circle class="tw" style="animation-delay:0.93s" cx="18" cy="188" r="1.1" fill="#fff" opacity="0.52"/><circle cx="537" cy="49" r="0.7" fill="#fff" opacity="0.66"/><circle class="tw" style="animation-delay:0.92s" cx="54" cy="10" r="0.7" fill="#fff" opacity="0.76"/><circle cx="890" cy="6" r="1.4" fill="#fff" opacity="0.66"/><circle class="tw" style="animation-delay:1.32s" cx="577" cy="44" r="0.5" fill="#fff" opacity="0.61"/><circle cx="434" cy="130" r="0.9" fill="#fff" opacity="0.84"/><circle class="tw" style="animation-delay:0.87s" cx="504" cy="187" r="0.9" fill="#fff" opacity="0.81"/><circle class="tw" style="animation-delay:0.91s" cx="256" cy="61" r="0.7" fill="#fff" opacity="0.48"/><circle class="tw" style="animation-delay:3.93s" cx="363" cy="10" r="0.5" fill="#fff" opacity="0.65"/><circle cx="865" cy="40" r="0.7" fill="#fff" opacity="0.77"/><circle class="tw" style="animation-delay:1.68s" cx="428" cy="100" r="1.4" fill="#fff" opacity="0.64"/><circle cx="573" cy="8" r="0.5" fill="#fff" opacity="0.74"/><circle class="tw" style="animation-delay:3.44s" cx="546" cy="100" r="0.5" fill="#fff" opacity="0.84"/><circle cx="314" cy="2" r="1.1" fill="#fff" opacity="0.55"/><circle cx="894" cy="26" r="1.4" fill="#fff" opacity="0.33"/><circle cx="553" cy="41" r="0.7" fill="#fff" opacity="0.78"/><circle cx="620" cy="111" r="1.4" fill="#fff" opacity="0.59"/><circle class="tw" style="animation-delay:2.77s" cx="774" cy="80" r="1.4" fill="#fff" opacity="0.47"/><circle class="tw" style="animation-delay:3.52s" cx="737" cy="65" r="0.9" fill="#fff" opacity="0.71"/>
</g><linearGradient id="pastel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ccfd8"/><stop offset=".5" stop-color="#c4a7e7"/><stop offset="1" stop-color="#eb6f92"/></linearGradient>
<clipPath id="frame"><rect width="900" height="200" rx="18"/></clipPath>
<clipPath id="glass"><rect x="40" y="72" width="110" height="46" rx="12"/><rect x="182" y="72" width="110" height="46" rx="12"/><rect x="324" y="72" width="110" height="46" rx="12"/><rect x="466" y="72" width="110" height="46" rx="12"/><rect x="608" y="72" width="110" height="46" rx="12"/><rect x="750" y="72" width="110" height="46" rx="12"/></clipPath>
<filter id="frost" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="14" edgeMode="duplicate"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<g clip-path="url(#frame)">
  <use href="#wall"/>
  <g fill="#000" opacity=".5" filter="url(#shadow)"><rect x="40" y="80" width="110" height="46" rx="12"/><rect x="182" y="80" width="110" height="46" rx="12"/><rect x="324" y="80" width="110" height="46" rx="12"/><rect x="466" y="80" width="110" height="46" rx="12"/><rect x="608" y="80" width="110" height="46" rx="12"/><rect x="750" y="80" width="110" height="46" rx="12"/></g>
  <g clip-path="url(#glass)"><use href="#wall" filter="url(#frost)"/></g>
